<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join The 300 · MAE.</title>
<meta name="description" content="Join The 300: pickup nights, run club and first word on MAE. Drop 01. Modest athletic wear for girls who hoop, run, and lift.">
<meta name="theme-color" content="#f4c21e">
<link rel="stylesheet" href="css/fonts.css?v=3">
<link rel="stylesheet" href="css/mae.css?v=72">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="community">
<a class="skip" href="#main">Skip to content</a>
<header data-site-header></header>

<main id="main">
  <section class="signup join" aria-labelledby="join-title">
    <div class="wrap">
      <span class="eyebrow">Faint, yet pursuing · Judges 8:4</span>
      <h1 class="headline" id="join-title" style="margin-top:6px">Join The 300.</h1>
      <p class="join__lead">Named for Gideon's 300: outnumbered, exhausted, still in the fight. Get first word on Drop 01, pickup nights and run club.</p>
      <form class="join-form" data-email-form="the-300" data-success="You're in. Watch your inbox for the first 300 run." novalidate>
        <div>
          <label class="field-label" for="join-name">First name</label>
          <input class="input" id="join-name" type="text" name="FNAME" autocomplete="given-name" placeholder="Your first name">
        </div>
        <div>
          <label class="field-label" for="join-email">Email</label>
          <input class="input" id="join-email" type="email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required aria-describedby="join-msg">
        </div>
        <button class="btn btn--ink" type="submit">Join The 300</button>
      </form>
      <p class="form-success" id="join-msg" data-form-msg tabindex="-1" aria-live="polite"></p>
      <ul class="join__perks">
        <li>First access to Drop 01</li>
        <li>Pickup nights and run club</li>
        <li>A verse on every drop</li>
      </ul>
    </div>
  </section>
</main>

<footer data-site-footer></footer>
<script src="js/mae.js?v=48"></script>
</body>
</html>
